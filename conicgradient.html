<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Gradient</title>
    <style>
        .box {
            width: 400px;
            height: 300px;

            background: conic-gradient(
                from 0deg,
                yellow,
                rgb(252, 36, 162),
                rgb(1, 255, 242),
                yellow
            );

            border-radius: 20px;
        }
        </style>
</head>
<body>
    <div class="box"></div>
    
</body>
</html>
