<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gradient Effect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;

            background: linear-gradient(
                to right,
                #e600ff,
                #8b5cf6,
                #00d9ff
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text {
            text-align: center;
        }

        .heading {
            color: white;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 90px;

            font-weight: 300;

            letter-spacing: 8px;

            margin: 0;
        }

        .subheading {
            color: white;

            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

            font-size: 20px;

            margin-top: 20px;

            line-height: 1.5;

            max-width: 500px;

            margin-left: auto;
            margin-right: auto;
        }

    </style>

</head>

<body>

    <div class="text">

        <h1 class="heading">
            IRIDESCENT
        </h1>

        <p class="subheading">
            A gradient effect that changes color based on the angle of the light.
        </p>

    </div>

</body>

</html>
