<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radial Gradient</title>

    <style>

        .box {
            width: 400px;
            height: 300px;

            background: radial-gradient(
                circle,
                #ffffff,
                #87CEEB,
                #1e3c72
            );

            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        h1{
            text-align: center;
            color: rgb(61, 32, 32);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            

        }

    </style>

</head>

<body>

    <div class="box">
        <h1>Radial</h1>
    </div>

</body>

</html>
