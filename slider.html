<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .slider {
            width: 100%;
            overflow:scroll;
            
        }
        </style>
</head>
<body>
    <div class="slider">
        <div class="slider" style="background-color: yellow;">1</div>
        <div class="slider" style="background-color: red;">2</div>
        <div class="slider" style="background-color: blue;">3</div>
        <div class="slider" style="background-color: green;">4</div>
    </div>
</body>
</html>
